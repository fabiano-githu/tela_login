<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <!--Link do Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--Link da fonte do Google-->
    <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
    <!--Link do CSS-->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!--container principal que amarra todo conteúdo-->
    <div class="wrapper">

        <!--Texto principal da tela login-->
        <div class="container_texto_principal">
            <h1>Faça Login</h1>
        </div>



        <!--Conteúdo principal a tela login-->
        <main class="container_principal">


            <!--DIV de formulário-->
            <div class="container_formulario">

                <!-- Imagem acima do formulário -->
                <img src="img/chavier_stunning_1-removebg-preview.png" alt="Logo" class="logo_login">


                <form class="formulario_login" action="login.php" method="POST">

                    <!-- E-mail -->
                    <div class="container_input">
                       
                        <div class="input_com_icone">
                            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                            <i class="bi bi-envelope-fill"></i>
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="container_input">
                      
                        <div class="input_com_icone">
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                            <i class="bi bi-lock-fill"></i>
                        </div>
                    </div>

                    <!-- Lembrar senha -->
                    <div class="opcoes_login">

                        <label class="lembrar">
                            <input type="checkbox" name="lembrar">
                            Lembrar-me
                        </label>

                        <a href="#">Esqueci minha senha</a>

                    </div>

                    <button class="btn-login" type="submit">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </button>

                    <div class="container-texto">
                        <p class="texto_login">
                            Don't have an account? <a href="#">Sign up</a>
                        </p>
                    </div>

                </form>


            </div>




        </main>

    </div>


    <!--Link do JS-->
    <script src="js/script.js"></script>

</body>

</html>
